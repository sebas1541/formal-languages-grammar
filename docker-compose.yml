version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./grammars.db
      - GRAMMAR_GEMINI_API_KEY=${GRAMMAR_GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  backend-data:
