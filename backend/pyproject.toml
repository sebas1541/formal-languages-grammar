[project]
name = "formal-grammar-backend"
version = "0.1.0"
description = "Backend service for managing formal grammars"
requires-python = ">=3.11"
authors = [{ name = "Sebastian Canon Castellanos" }]
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.18",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"
